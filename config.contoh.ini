; =====================================================================
;  HA Helper - contoh konfigurasi
;  Salin berkas ini menjadi config.ini lalu sesuaikan dengan cluster Anda.
;  Semua alamat & nama di bawah hanya CONTOH.
;  Baris yang diawali ; adalah catatan.
;  Sandi yang dikosongkan akan ditanyakan saat program dijalankan.
; =====================================================================

[umum]
alamat_dashboard = 127.0.0.1      ; hanya bisa dibuka dari komputer ini
port_dashboard   = 8099
interval_detik   = 5              ; seberapa sering cluster dicek
batas_lag_mb     = 16             ; di atas ini dianggap tertinggal
pemimpin_utama   = db-node1       ; node yang seharusnya jadi pemimpin (boleh kosong)
timeout_detik    = 2

[node_database]
; nama sesuai "patronictl list" = IP
db-node1 = 10.10.0.11
db-node2 = 10.10.0.12
db-node3 = 10.10.0.13

[anggota_etcd]
db-node1 = 10.10.0.11
db-node2 = 10.10.0.12
db-node3 = 10.10.0.13
witness1 = 10.10.0.21
witness2 = 10.10.0.22

[porta]
patroni           = 8008
etcd              = 2379
statistik_haproxy = 7000
haproxy_tulis     = 5432
haproxy_baca      = 5434

[haproxy]
pengguna   = admin
sandi      =                      ; sandi "stats auth" HAProxy
alamat_vip = 10.10.0.10           ; VIP keepalived, boleh lebih dari satu dipisah koma

[produksi]
; server sumber streaming (bila cluster ini masih standby dari server lain).
; Bila cluster sudah menjadi utama: aktif = no
aktif    = yes
alamat   = 10.20.0.5
porta    = 5432
pengguna = postgres
sandi    =
database = appdb

[cluster]
alamat_haproxy             = 10.10.0.10   ; alamat yang dipakai aplikasi (VIP atau salah satu node)
pengguna                   = postgres
sandi                      =
sandi_sama_dengan_produksi = yes

[cek_data]
rentang_menit = 60

[tabel_cek_data]
; tabel = kolom waktu (tabel yang sering bertambah datanya)
transaksi     = tgl_transaksi
kunjungan     = tgl_masuk
log_aktivitas = waktu

[email]
aktif             = no
server            = smtp.gmail.com
porta             = 587
starttls          = yes
pengguna          = notifikasi@example.com
sandi             =                 ; Gmail: App Password 16 huruf (bukan sandi biasa)
pengirim          = notifikasi@example.com
penerima          = admin@example.com
kirim_mulai_level = warn            ; warn = PERHATIAN & KRITIS, crit = hanya KRITIS
